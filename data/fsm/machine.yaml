# The finite-state machine that is the FSM agent's instruction base (T-02).
#
# This file is the single source of the state and event names: the engine (T-08), the
# stage labeler's enum (T-13), the flow-adherence metric and the diagram of docs/fsm.md
# all load them from here. Each state names an instruction package in states/. Both
# agents receive the same full knowledge base; the packages say what to do in that
# state, never which facts to use.
#
# `guard` names a condition the engine evaluates from data/kb/user_data_fields.json,
# so the regex and the `required_for` of each datum are written in one place only.

version: 1
initial: greeting
# The states a dialogue may legitimately end in, which are also the values a
# scenario's `expected_final_state` may take (T-05). They are *not* terminal states:
# `out_of_scope` has two ways out, and the engine of T-08 must keep them firing.
accepting_states: [closing, out_of_scope]

states:
  greeting:
    package: states/greeting.md
  identification:
    package: states/identification.md
  intent_classification:
    package: states/intent_classification.md
  data_collection:
    package: states/data_collection.md
  solution:
    package: states/solution.md
  confirmation:
    package: states/confirmation.md
  closing:
    package: states/closing.md
  out_of_scope:
    package: states/out_of_scope.md

transitions:
  - event: request_received
    from: greeting
    to: identification
  - event: order_identified
    from: identification
    to: intent_classification
    guard: order_and_email_present
  - event: intent_classified
    from: intent_classification
    to: data_collection
  - event: data_provided
    from: data_collection
    to: solution
    guard: required_data_collected
  - event: solution_accepted
    from: solution
    to: confirmation
  - event: user_confirmed
    from: confirmation
    to: closing
  - event: user_dissatisfied
    from: confirmation
    to: solution
  - event: request_received
    from: out_of_scope
    to: identification
  - event: escalation_accepted
    from: out_of_scope
    to: closing
  # Every state has a way out to out_of_scope, and a way out when the user says
  # goodbye mid-flow. The loader expands `"*"` into one transition per state.
  - event: out_of_scope_request
    from: "*"
    to: out_of_scope
  - event: farewell
    from: "*"
    to: closing
